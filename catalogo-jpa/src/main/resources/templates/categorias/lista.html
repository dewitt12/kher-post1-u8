<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Categorías</title><style>body{font-family:sans-serif;max-width:800px;margin:2rem auto}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ccc;padding:6px 10px;text-align:left}.err,.error{color:#b00020}nav a{margin-right:1rem}div.f{margin:.6rem 0}</style></head>
<body>
  <nav><a th:href="@{/categorias}">Categorías</a><a th:href="@{/productos}">Productos</a></nav>
  <h1>Lista de Categorías</h1>
  <p class="error" th:if="${error}" th:text="${error}"></p>
  <a th:href="@{/categorias/nuevo}">Nueva Categoría</a>
  <table>
    <thead><tr><th>Nombre</th><th>Descripción</th><th>Acciones</th></tr></thead>
    <tbody>
      <tr th:each="c : ${categorias}">
        <td th:text="${c.nombre}"></td>
        <td th:text="${c.descripcion}"></td>
        <td>
          <a th:href="@{/categorias/editar/{id}(id=${c.id})}">Editar</a>
          <a th:href="@{/categorias/eliminar/{id}(id=${c.id})}">Eliminar</a>
          <a th:href="@{/productos/categoria/{id}/precio-mayor(id=${c.id},minimo=50000)}">Productos &gt; 50.000</a>
        </td>
      </tr>
    </tbody>
  </table>
</body>
</html>
